# Vision (host) and ingest (Compose network) connect here; the PC connects over the tailnet.
listener 1883

# One account, `trafficcam`. The container builds the password file from
# MQTT_PASSWORD at start (see compose.yaml).
allow_anonymous false
global_plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /tmp/passwd

# SQLite persistence writes changes as they happen, so QoS 1 messages queued for
# ingest's persistent session survive a broker restart or a power cut.
persistence_location /mosquitto/data/
global_plugin /usr/lib/mosquitto_persist_sqlite.so

# Per-client queue for offline persistent sessions (default 1000).
max_queued_messages 100000
