# Infrastructure stack on the Pi. Vision runs on the host under systemd, not here.
#
# Networking:
#   - mosquitto, timescaledb, ingest and web sit on the Compose network and publish ports.
#   - grafana, victoriametrics, node-exporter and mediamtx use the host network.
#     The scrape targets (vision :9200, node-exporter :9100) listen on the host's
#     loopback only, which a bridged container cannot reach, and Grafana has to
#     reach VictoriaMetrics in turn.
#
# Data lives on the SSD. Data mounts set create_host_path: false, so a container
# fails to start rather than writing to the SD card when /mnt/data is not mounted.

name: trafficcam

x-service: &service
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: 10m, max-file: "3" }

services:
  # One-shot, run by `just deploy` before `up`: creates the data directories
  # with the owners each image expects. The profile keeps it out of `up`.
  data-dirs:
    profiles: [setup]
    image: eclipse-mosquitto:2.1.2-alpine # any image with a shell
    user: root
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /data/mosquitto /data/postgres /data/grafana /data/victoriametrics
        chown 1883:1883 /data/mosquitto
        chown 472:0 /data/grafana
    volumes:
      - type: bind
        source: /mnt/data
        target: /data
        bind: { create_host_path: false }

  mosquitto:
    <<: *service
    image: eclipse-mosquitto:2.1.2-alpine
    # Runs as the image's mosquitto user from the start, so the password file
    # it creates below has the owner the broker expects.
    user: "1883:1883"
    environment:
      MQTT_PASSWORD: ${MQTT_PASSWORD:?set it in deploy/.env}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        rm -f /tmp/passwd
        mosquitto_passwd -b -c /tmp/passwd trafficcam "$$MQTT_PASSWORD"
        exec /usr/sbin/mosquitto -c /mosquitto/config/mosquitto.conf
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - type: bind
        source: /mnt/data/mosquitto
        target: /mosquitto/data
        bind: { create_host_path: false }
    healthcheck:
      test: ["CMD-SHELL", "mosquitto_sub -u trafficcam -P \"$$MQTT_PASSWORD\" -t '$$SYS/broker/uptime' -C 1 -W 3"]

  timescaledb:
    <<: *service
    image: timescale/timescaledb:2.30.2-pg18
    ports:
      - "127.0.0.1:5432:5432"
    shm_size: 256mb
    environment:
      POSTGRES_USER: trafficcam
      POSTGRES_DB: trafficcam
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env}
      TIMESCALEDB_TELEMETRY: "off"
      # Cap what timescaledb-tune sizes Postgres for; the Pi's 8 GB is shared with vision.
      TS_TUNE_MEMORY: 2GB
    volumes:
      # PostgreSQL 18 images keep PGDATA under /var/lib/postgresql/18/docker.
      - type: bind
        source: /mnt/data/postgres
        target: /var/lib/postgresql
        bind: { create_host_path: false }
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "trafficcam", "-d", "trafficcam"]

  # Published on the PC by `just deploy` into ./ingest; there is no image to build.
  ingest:
    <<: *service
    # The tag must provide the .NET runtime that ingest was published for.
    image: mcr.microsoft.com/dotnet/aspnet:10.0.12
    user: app
    working_dir: /app
    command: ["dotnet", "TrafficCam.Ingest.dll"]
    depends_on:
      mosquitto: { condition: service_healthy }
      timescaledb: { condition: service_healthy }
    ports:
      - "127.0.0.1:8080:8080" # /metrics, for VictoriaMetrics
    environment:
      Mqtt__Host: mosquitto
      Mqtt__Password: ${MQTT_PASSWORD:?set it in deploy/.env}
      Database__Host: timescaledb
      Database__Password: ${POSTGRES_PASSWORD:?set it in deploy/.env}
    volumes:
      - ./ingest:/app:ro
    healthcheck:
      # The image has no curl or wget, so the program checks itself.
      test: ["CMD", "dotnet", "TrafficCam.Ingest.dll", "--healthcheck"]
      interval: 60s
      start_period: 60s
      start_interval: 5s

  # The clips site: lists and plays what is in /mnt/data/clips, and keeps what is said about
  # each clip. Open to the local network without a login. It never writes to the clips folder;
  # it asks vision over the broker. Published by `just deploy` into ./web, as ingest is.
  web:
    <<: *service
    image: mcr.microsoft.com/dotnet/aspnet:10.0.12
    user: app
    working_dir: /app
    command: ["dotnet", "TrafficCam.Web.dll"]
    depends_on:
      # Ingest creates the tables this reads.
      ingest: { condition: service_healthy }
      mosquitto: { condition: service_healthy }
    ports:
      - "8081:8080"
    environment:
      Database__Host: timescaledb
      Database__Password: ${POSTGRES_PASSWORD:?set it in deploy/.env}
      Mqtt__Host: mosquitto
      Mqtt__Password: ${MQTT_PASSWORD:?set it in deploy/.env}
      # camera.id in config/site.yaml: vision ignores a request made for any other camera.
      Camera: junction-1
    volumes:
      - ./web:/app:ro
      # At the same path as on the host, which is the path the database has for each clip.
      - type: bind
        source: /mnt/data/clips
        target: /mnt/data/clips
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: ["CMD", "dotnet", "TrafficCam.Web.dll", "--healthcheck"]
      interval: 60s
      start_period: 60s
      start_interval: 5s

  # The live view: a drawing of the junction with its traffic and signals, a minute and a
  # half behind. Read-only, and open to the local network without a login.
  live:
    <<: *service
    image: mcr.microsoft.com/dotnet/aspnet:10.0.12
    user: app
    working_dir: /app
    command: ["dotnet", "TrafficCam.Live.dll"]
    depends_on:
      # Ingest creates the tables this reads.
      ingest: { condition: service_healthy }
    ports:
      - "8082:8080"
    environment:
      Database__Host: timescaledb
      Database__Password: ${POSTGRES_PASSWORD:?set it in deploy/.env}
    volumes:
      - ./live:/app:ro
    healthcheck:
      test: ["CMD", "dotnet", "TrafficCam.Live.dll", "--healthcheck"]
      interval: 60s
      start_period: 60s
      start_interval: 5s

  grafana:
    <<: *service
    image: grafana/grafana:13.2.3
    network_mode: host # :3000
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set it in deploy/.env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # Used for the links in alert emails.
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${SMTP_HOST:?set it in deploy/.env}
      GF_SMTP_USER: ${SMTP_USER:?set it in deploy/.env}
      GF_SMTP_PASSWORD: ${SMTP_PASSWORD:?set it in deploy/.env}
      # Mail providers reject a sender other than the account that logs in.
      GF_SMTP_FROM_ADDRESS: ${SMTP_USER}
      GF_SMTP_FROM_NAME: Traffic cam
      GF_SMTP_STARTTLS_POLICY: MandatoryStartTLS
      # Read by provisioning/datasources/datasources.yaml.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set it in deploy/.env}
      # Read by provisioning/alerting/contact-points.yaml.
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:?set it in deploy/.env}
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - type: bind
        source: /mnt/data/grafana
        target: /var/lib/grafana
        bind: { create_host_path: false }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      # The first start runs about 800 database migrations before listening,
      # which took 14 minutes on the USB hard drive.
      start_period: 20m
      start_interval: 10s

  victoriametrics:
    <<: *service
    image: victoriametrics/victoria-metrics:v1.153.0
    network_mode: host
    command:
      - -httpListenAddr=127.0.0.1:8428
      - -storageDataPath=/storage
      - -retentionPeriod=1y
      - -promscrape.config=/etc/victoriametrics/scrape.yaml
    volumes:
      - ./victoriametrics/scrape.yaml:/etc/victoriametrics/scrape.yaml:ro
      - type: bind
        source: /mnt/data/victoriametrics
        target: /storage
        bind: { create_host_path: false }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8428/health"]

  node-exporter:
    <<: *service
    image: prom/node-exporter:v1.12.1
    network_mode: host
    pid: host
    command:
      - --path.rootfs=/host
      - --web.listen-address=127.0.0.1:9100
      # Written on the host by trafficcam-throttled.service.
      - --collector.textfile.directory=/host/dev/shm/trafficcam
    volumes:
      - /:/host:ro,rslave
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9100/"]

  # The image is built from scratch: no shell or HTTP client, so no health check.
  mediamtx:
    <<: *service
    image: bluenviron/mediamtx:1.21.1
    network_mode: host # UDP :1234 in, RTSP :8554 and WebRTC :8889 out
    volumes:
      - ./mediamtx/mediamtx.yml:/mediamtx.yml:ro
