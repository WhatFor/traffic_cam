# Live view: re-muxes the vision service's MPEG-TS stream; no transcoding.
# Options not set here keep the MediaMTX defaults (RTSP :8554, WebRTC :8889).

rtmp: false
hls: false
srt: false
moq: false

# A keyframe arrives as one burst of a few hundred kB, which overflows the
# kernel's default 208 kB socket buffer and drops packets. Must not exceed
# net.core.rmem_max on the host (4 MiB on Raspberry Pi OS).
udpReadBufferSize: 2097152

paths:
  cam:
    source: udp+mpegts://127.0.0.1:1234
    sourceOnDemand: true
