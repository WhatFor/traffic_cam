# Site config: geometry and detector parameters. No secrets.
# All coordinates are pixels in the camera.size frame.
# Empty sections are filled in from a full-frame grab during calibration.

camera: { id: junction-1, size: [2028, 1520], fps: 15 }

inference:
  model: /usr/share/hailo-models/yolov8s_h8.hef
  threshold: 0.35
  classes: [car, truck, bus, motorcycle, bicycle]
  crops:                                          # x, y, w, h; square, resized to 640x640
    - [511, 297, 1060, 1060]                      # junction and the three visible arms

tracking:
  lost_s: 2.0                     # a track survives this long without a matching detection
  activation_threshold: 0.5       # minimum confidence to start a new track
  high_confidence_threshold: 0.5  # below this, a detection can only continue an existing track
  min_consecutive_frames: 3       # frames before a new track is confirmed
  min_iou: 0.1                    # minimum overlap to match a detection to a track

# The camera looks east: the foreground approach is the west arm, north is to
# the left and the south arm is hidden behind the building on the right.
junction: box_junction            # the zone that lines' inbound and outbound are relative to

zones:
  box_junction:                                   # right side clipped where the building hides it
    polygon: [[960, 776], [1204, 570], [1519, 618], [1508, 714], [1478, 734], [1469, 830], [1453, 858]]
  approach_west:
    role: approach
    arm: west
    polygon: [[327, 1194], [343, 1099], [504, 984], [575, 932], [710, 956], [937, 1000], [762, 1184], [593, 1330]]
  exit_west:
    role: exit
    arm: west
    polygon: [[1079, 992], [1361, 1051], [1252, 1280], [1196, 1469], [875, 1424], [680, 1353], [832, 1195], [997, 1047]]
  approach_north:
    role: approach
    arm: north
    polygon: [[518, 583], [809, 599], [781, 666], [518, 666]]
  exit_north:
    role: exit
    arm: north
    polygon: [[540, 673], [732, 695], [797, 704], [797, 774], [617, 774], [540, 745]]
  approach_east:
    role: approach
    arm: east
    polygon: [[1435, 640], [1512, 680], [1535, 550], [1575, 377], [1537, 372], [1504, 432], [1471, 506], [1440, 590]]
  # The building on the right hides the south arm and the nearer westbound lanes of
  # the east arm. Traffic from both first appears in the same patch, so the two zones
  # share a polygon and are told apart by which way a vehicle is heading when it appears.
  approach_south:                                 # heading across the image, to the left
    role: approach
    arm: south
    entry_heading: [120, 215]
    polygon: [[1385, 690], [1510, 712], [1478, 734], [1469, 830], [1453, 858], [1440, 905], [1375, 895]]
  approach_east_hidden:                           # heading down the image, like the rest of the east arm
    role: approach
    arm: east
    entry_heading: [220, 265]
    polygon: [[1385, 690], [1510, 712], [1478, 734], [1469, 830], [1453, 858], [1440, 905], [1375, 895]]
  exit_east:
    role: exit
    arm: east
    polygon: [[1214, 560], [1265, 494], [1397, 365], [1488, 271], [1533, 282], [1466, 401], [1420, 496], [1369, 567]]
  exit_south:                                     # where traffic bound for the hidden arm is last seen
    role: exit
    arm: south
    polygon: [[1468, 676], [1488, 660], [1512, 656], [1512, 722], [1480, 730], [1468, 716]]

lines:
  # West-arm traffic drives away from the camera, so the tracked point is a vehicle's rear:
  # lag_s is roughly how long before that its front crossed the line.
  stopline_west_eastbound: { points: [[708, 956], [937, 1000]], direction: inbound, lag_s: 0.7 }
  stopline_west_northbound: { points: [[631, 852], [781, 854]], direction: inbound, lag_s: 0.7 }   # left-turn slip lane
  stopline_north: { points: [[813, 604], [712, 689]], direction: inbound }
# Right turns, which may wait in the box for oncoming traffic, and the left turn out of the
# south arm, which is forbidden.
movements:
  right_from_east: { from: approach_east, to: exit_north }
  right_from_east_hidden: { from: approach_east_hidden, to: exit_north }
  right_from_north: { from: approach_north, to: exit_west }
  right_from_south: { from: approach_south, to: exit_east }
  right_from_west: { from: approach_west, to: exit_south }
  left_from_south: { from: approach_south, to: exit_west }
# Lamp squares are [x, y, w, h] in full-frame pixels. Each is 3x3 on the middle of its lamp, as
# measured in daylight, when a lamp shows without glow: by day a lamp is only 3 or 4 pixels
# across and a square that is 2 pixels off misses it. The letters are the ones used in
# docs/spikes/lamp-readability.md, which says how the squares were found.
signal_heads:
  west_north_near:  # A
    lamps: { red: [593, 746, 3, 3], amber: [594, 755, 3, 3], green: [594, 764, 3, 3] }
    controls: [stopline_west_northbound]
  west_north_far:  # B
    lamps: { red: [792, 701, 3, 3], amber: [793, 710, 3, 3], green: [794, 718, 3, 3] }
    controls: [stopline_west_northbound]
  west_ahead_left:  # C
    lamps: { red: [815, 763, 3, 3], amber: [816, 772, 3, 3], green: [816, 782, 3, 3] }
    controls: [stopline_west_eastbound]
  west_ahead_right:  # E: hooded and side-on; in daylight its red cannot be seen, only its green
    lamps: { red: [1043, 811, 3, 3], amber: [1044, 821, 3, 3], green: [1043, 831, 3, 3] }
    controls: [stopline_west_eastbound]
  west_ahead_far:  # G: far side, small
    lamps: { red: [1426, 483, 3, 3], amber: [1426, 489, 3, 3], green: [1426, 496, 3, 3] }
    controls: [stopline_west_eastbound]
  south:  # D: seen from the side; only its green arrows can be read
    lamps: { green: [972, 638, 3, 3] }
    controls: [right_from_south, left_from_south]
  crossing_west_exit:  # F: pedestrian signal; its red and green figures are 5 pixels apart
    lamps: { red: [1092, 887, 3, 3], green: [1091, 892, 3, 3] }
    controls: []

# The road in metres: points found both in the frame and on a map, fitted with
# `just calibrate-speed`. Distances are measured only among them. Metres are east and north
# of the first point.
ground_points:
  - { pixel: [958, 776], ground: [0.00, 0.00] }       # box junction, north-west corner
  - { pixel: [1201, 574], ground: [24.35, 7.46] }     # box junction, north-east corner
  - { pixel: [1452, 861], ground: [5.56, -16.47] }    # box junction, south-west corner
  - { pixel: [735, 957], ground: [-13.98, -4.22] }    # west approach cycle box, rear corner
  - { pixel: [792, 909], ground: [-10.59, -3.20] }    # west approach cycle box, front corner
  - { pixel: [740, 671], ground: [2.00, 13.90] }      # north stop line, island end
  - { pixel: [809, 612], ground: [9.44, 17.81] }      # north stop line, kerb end
  - { pixel: [1354, 576], ground: [27.60, 1.20] }     # nose of the island east of the box
  - { pixel: [1009, 704], ground: [6.23, 3.02] }      # nose of the island north of the box

detectors:
  box_junction:
    min_stationary_s: 3.0
    stationary_radius_px: 10      # a standing vehicle's ground point wanders by about 4 px
    exempt_movements:
      [right_from_east, right_from_east_hidden, right_from_north, right_from_south, right_from_west]
  banned_turns:
    movements: [left_from_south]
    signal_heads: [south, crossing_west_exit]   # what these showed is noted on the event
  red_light: { grace_s: 0.5 }
  speed:
    sustained_s: 1.0              # a passage's speed is the fastest it held for this long
    stretches:                    # average speed, entry to exit, for the dashboard
      box:                        # across the box junction, as far as the camera sees it
        polygon: [[960, 776], [1204, 570], [1519, 618], [1508, 714], [1478, 734], [1469, 830], [1453, 858]]
        min_m: 12
    limit_mph: 30
    flag_above_mph: 35            # the limit, plus 10% and 2 mph
  near_miss:
    # Crossing paths whose tracked points reach one spot less than this apart. A vehicle is
    # one point here, so 2 s between points is about 1.5 s between bodies, the usual threshold.
    pet_max_s: 2.0
    min_angle_deg: 60             # less is one following the other, or two streams merging
    min_speed_mph: 8              # slower than this, vehicles are edging round each other in the box
  incident:
    contact_s: 1.0                # points this close in time may be bodies touching; none in 17 h of traffic
    standstill_after_s: 20        # ...and count if one of the two then stands this long
    lone_standstill_s: 90         # standing a whole signal cycle where traffic does not queue
    min_confidence: 0.5           # a candidate this sure is an event
    notify_min_confidence: 0.7    # for the notifier, when there is one

clips:
  dir: /mnt/data/clips
  pre_s: 5              # kept before and after a trigger; the manual trigger uses these
  post_s: 55
  buffer_s: 90          # video held in memory, so a clip can reach back to an event raised late
  max_s: 300
  retention_days: 30
  max_gb: 200
  events:               # the event types that trigger a clip, with their own lengths
    red_light: { pre_s: 5, post_s: 15 }
    banned_turn: { pre_s: 5, post_s: 15 }
    # A stop in the box is sometimes what follows a collision: on 2026-10-07 one began six
    # seconds after two cars met, and with 5 s of lead-in its clip missed the impact by a moment.
    box_junction_stop: { pre_s: 30, post_s: 15 }
    speeding: { pre_s: 5, post_s: 15, min: { speed_mph: 45 } }   # an event from 35, a clip from 45
    near_miss: { pre_s: 5, post_s: 10, max: { pet_s: 1.5 } }     # an event under 2 s, a clip under 1.5
    incident_candidate: {}                                        # the default lengths
