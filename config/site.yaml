# Site config: geometry and detector parameters. No secrets.
# All coordinates are pixels in the camera.size frame.
# Empty sections are filled in from a full-frame grab during calibration.

camera: { id: junction-1, size: [2028, 1520], fps: 15 }

inference:
  model: /usr/share/hailo-models/yolov8s_h8.hef
  threshold: 0.35
  classes: [car, truck, bus, motorcycle, bicycle]
  crops:                                          # x, y, w, h; square, resized to 640x640
    - [511, 297, 1060, 1060]                      # junction and the three visible arms

tracking:
  lost_s: 2.0                     # a track survives this long without a matching detection
  activation_threshold: 0.5       # minimum confidence to start a new track
  high_confidence_threshold: 0.5  # below this, a detection can only continue an existing track
  min_consecutive_frames: 3       # frames before a new track is confirmed
  min_iou: 0.1                    # minimum overlap to match a detection to a track

# The camera looks east: the foreground approach is the west arm, north is to
# the left and the south arm is hidden behind the building on the right.
junction: box_junction            # the zone that lines' inbound and outbound are relative to

zones:
  box_junction:                                   # right side clipped where the building hides it
    polygon: [[960, 776], [1204, 570], [1519, 618], [1508, 714], [1478, 734], [1469, 830], [1453, 858]]
  approach_west:
    polygon: [[327, 1194], [343, 1099], [504, 984], [575, 932], [710, 956], [937, 1000], [762, 1184], [593, 1330]]
  exit_west:
    polygon: [[1079, 992], [1361, 1051], [1252, 1280], [1196, 1469], [875, 1424], [680, 1353], [832, 1195], [997, 1047]]
  approach_north:
    polygon: [[518, 583], [809, 599], [781, 666], [518, 666]]
  exit_north:
    polygon: [[540, 673], [732, 695], [797, 704], [797, 754], [617, 752], [540, 716]]
  approach_east:
    polygon: [[1455, 549], [1535, 550], [1575, 377], [1537, 372], [1504, 432], [1471, 506]]
  exit_east:
    polygon: [[1214, 560], [1265, 494], [1397, 365], [1488, 271], [1533, 282], [1466, 401], [1420, 496], [1369, 567]]

lines:
  stopline_west_eastbound: { points: [[708, 956], [937, 1000]], direction: inbound }
  stopline_west_northbound: { points: [[631, 852], [781, 854]], direction: inbound }   # left-turn slip lane
  stopline_north: { points: [[813, 604], [712, 689]], direction: inbound }
movements: {}
signal_heads: {}

detectors:
  box_junction: { min_stationary_s: 3.0, exempt_movements: [] }
  red_light: { grace_s: 0.5 }
  incident: { decel_mps2: 6.0, notify_min_confidence: 0.7 }

clips: { dir: /mnt/data/clips, pre_s: 5, post_s: 55, retention_days: 30, max_gb: 200 }
