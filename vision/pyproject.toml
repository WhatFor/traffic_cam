[project]
name = "trafficcam"
version = "0.1.0"
description = "Traffic camera vision service: capture, inference, tracking, detectors"
# Matches the Pi's system Python; the venv there uses --system-site-packages.
requires-python = ">=3.13,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
