[project]
name = "trafficcam"
version = "0.1.0"
description = "Traffic camera vision service: capture, inference, tracking, detectors"
# Matches the Pi's system Python; the venv there uses --system-site-packages.
requires-python = ">=3.13,<3.14"
# rerun-sdk must equal the viewer version on the PC (`rerun --version`).
dependencies = ["numpy>=2", "pydantic>=2", "pyyaml>=6", "rerun-sdk==0.38.1"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["datamodel-code-generator>=0.83", "jsonschema>=4", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
