[project]
name = "trafficcam"
version = "0.1.0"
description = "Traffic camera vision service: capture, inference, tracking, detectors"
# Matches the Pi's system Python; the venv there uses --system-site-packages.
requires-python = ">=3.13,<3.14"
# rerun-sdk must equal the viewer version on the PC (`rerun --version`).
dependencies = [
    # The Pi uses the apt builds of PyAV and OpenCV that its picamera2 was packaged with.
    "av==14.2.0; platform_machine != 'aarch64'",
    "numpy>=2",
    "paho-mqtt>=2.1,<3",
    "opencv-python-headless>=4.10,<4.11; platform_machine != 'aarch64'",
    "pillow>=11",
    "pydantic>=2",
    "pyyaml>=6",
    "rerun-sdk==0.38.1",
    "supervision>=0.30,<0.31",
    "trackers>=2.6,<3",
    "prometheus-client>=0.26,<1",
]

[tool.uv]
# supervision depends on PyAV and trackers on opencv-python; these keep the PyPI
# builds off the Pi (see above).
override-dependencies = ["av==14.2.0; platform_machine != 'aarch64'"]
exclude-dependencies = ["opencv-python"]

[build-system]
requires = ["uv_build>=0.12.17,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["datamodel-code-generator>=0.83", "jsonschema>=4", "pytest>=8"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.13"
